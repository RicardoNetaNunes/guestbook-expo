<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Livro de Visitas</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="qr-body">
    <div class="poster-dots poster-dots-top" aria-hidden="true"></div>
    <div class="poster-swoosh poster-swoosh-blue" aria-hidden="true"></div>
    <div class="poster-swoosh poster-swoosh-red" aria-hidden="true"></div>
    <main class="qr-stage">
      <aside class="qr-mural-shell">
        <section class="qr-mural card" aria-live="polite">
          <div class="qr-mural-head">
            <p class="eyebrow">Mural ao vivo</p>
            <p class="qr-mural-count">Mensagens aprovadas: <strong id="qr-review-count">0</strong></p>
          </div>
          <div id="qr-review-stage" class="qr-review-stage">
            <article class="qr-postit qr-postit-empty">
              <p class="qr-postit-label">A aguardar reviews</p>
              <p class="qr-postit-text">As mensagens aprovadas vao aparecer aqui uma a uma.</p>
            </article>
          </div>
        </section>
      </aside>
      <section class="card qr-card">
        <div class="qr-visuals">
          <img src="qr.svg" alt="Codigo QR para abrir o livro de visitas" class="qr-code">
        </div>
        <div class="qr-copy">
          <p class="eyebrow">Livro de Visitas</p>
          <h1>Digitaliza e participa.</h1>
          <p>Abre o mural no telemovel, deixa a tua mensagem e entra no ambiente do Dia da Multimedia.</p>
        </div>
        <div class="qr-logo-frame">
          <img src="logo-qr.png" alt="Dia da Multimédia 2026" class="qr-logo">
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="qr.js"></script>
  </body>
</html>
