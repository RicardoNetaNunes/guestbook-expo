<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Livro de Visitas</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="qr-body">
    <div class="poster-dots poster-dots-top" aria-hidden="true"></div>
    <div class="poster-swoosh poster-swoosh-blue" aria-hidden="true"></div>
    <div class="poster-swoosh poster-swoosh-red" aria-hidden="true"></div>
    <main class="qr-stage">
      <img src="logo.png" alt="Dia da Multimédia 2026" class="qr-logo">
      <img src="qr.svg" alt="Codigo QR para abrir o livro de visitas">
      <p>Digitaliza o QR code para deixar a tua mensagem</p>
     <!-- <p id="qr-url" class="brand-kicker"></p> -->
    </main>

    <script src="config.js"></script>
    <script src="qr-page.js"></script>
  </body>
</html>
